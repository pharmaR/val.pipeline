default:

  # Pkgs that are too time intensive to run riskmetric assessment with pkg_ref == "source"
  # withr - crashes, VGAM 10h, shinyBS 5h, collapse 1.6h, fitdistrplus 1.7h, gamlss.dist 52m, gss 52m, segmented 45m, RSiena 1.6hr, qtl 22hr, openxlsx2 60m, BayesXsrc 45m,
  remote_only: [withr, VGAM, shinyBS, fitdistrplus, collapse, gamlss.dist, gss, segmented, RSiena, qtl, openxlsx2, BayesXsrc] 
  
  # Pkgs that shouldn't be immediately filtered from (1) val_categorize() or (2) from primary metrics in val_decision(). These packages have low annual downloads (< 80,000/yr per cranlogs at the last audit), so they wouldn't clear the downloads_1yr rule on their own, but we want them to receive their full day in court & retrieve code coverage metrics. Popular packages (>= 80,000/yr) don't need this bypass and were pruned from this list — see dev/pass_primary_audit.md for the removal list and audit methodology.
  # Pharmaverse + provided lists from org
  pass_primary: [
    logrx, admiral, sdtm.oak, cardinal, admiral.test, admiralonco, admiralvaccine, tidytlg,
    pharmaversesdtm, pharmaverseadam, rlistings, sdtmchecks, metatools, admiraldev, admiralophtha,
    datacutr, admiralci, envsetup, cards, cardx, mmrm,
    addinexamples, apt, assertr, autoslider.core, base, bbr,
    bbr.bayes, bcrm, berryFunctions, BiocParallel, BiocVersion, blogdown, chevron, clinfun,
    compareDF, compiler, condSURV, constructive, covtracer, crmPack, CTP, daff, data.validator,
    datapasta, datasets, descem, diffdf, diffr, docxtractr, dunlin, facetsr, flexsurvPlus,
    future.batchtools, gemtcPlus, gfonts, gghalves, gginnards, ggplot2.utils, ghqc, gitworkr,
    goshawk, graphics, grDevices, greekLetters, grid, hashr, hermes, hrbrthemes, jsTreeR, lastdose,
    logitnorm, lookup, MAIC, metacore, methods, metrumrg, Microsoft365R, mrgda, mrggsave, mrgmisc,
    mrgsolve, mtdesign, ncappc, nestcolor, nesttemplate, nhanesA, nlmixr, NMcheckData, NMdata,
    NMproject, nmrec, NMsim, noindex, nonmem2R, osprey, overlapping, parallel, pharmaRTF, pharmr,
    pkglite, pkgr, PKNCA, pmforest, pmparams, pmplots, pmtables, pmxTools, PopED, psborrow,
    r.pkg.template, random.cdisc.data, randomForest, rbmi, RDO, readsas, reporter, respectables,
    riskassessment, rmsfuns, RNMImport, roxy.shinylive, rpsftmPlus, RsNLME, rspeaksnonmem, rtables,
    rtables.officer, sas7bdat, sasxport, scda, scda.2021, scda.2022, semantic.assets, sensitivity,
    sftp, shiny.semantic, simaerep, simIDM, simpar, sloop, splines, staged.dependencies, stats,
    stats4, strex, syntrial, tcltk, teal, teal.code, teal.data, teal.goshawk, teal.logger,
    teal.modules.clinical, teal.modules.general, teal.modules.hermes, teal.osprey, teal.reporter,
    teal.slice, teal.transform, teal.widgets, tern, tern.gee, tern.mmrm, tern.rbmi, texPreview,
    tfrmt, this.path, tidyCDISC, tidycmprsk, tidylog, tidyvpc, tools, Tplyr, translations,
    treesitter, treesitter.r, utils, validate, valtools, visR, vpc, vtable, xgxr, xportr, xpose,
    xpose4, yspec
  ]
  
  # packages that have been approved manually outside of {val.pipeline} workflow
  approved_pkgs: [
    tidyverse, ggplot2, dplyr, tidyr, readr, purrr, tibble, stringr, forcats, lubridate,
    DBI, haven, httr, readxl, googlesheets4, googledrive, rvest, jsonlite, xml2,
    hms, blob, dbplyr, dtplyr,
    magrittr, glue,
    readxl, vroom, 
    
    tidymodels, rsample, parsnip, recipes, workflows, tune, yardstick, broom, dials,
    
    devtools, lintr, pak, cli, roxygen2, testthat, usethis, pkgdown, httr2, rlang,
    xml2, progress, scales, here, R6, fs, remotes, covr, rcmdcheck,
    
    shiny, rmarkdown,
    
    gt
  ] 
  decisions_lst: [Low, Medium, High]
  # Which riskmetric ref type to use for the *initial* assessment pass of
  # Bioconductor packages inside val_pkg(). Options:
  #   "install" — use pkg_ref(pkg, source = "pkg_install", lib.loc = .libPaths()[1]).
  #     Recommended default: reads DESCRIPTION/NEWS from the pipeline library
  #     with no bioconductor.org scraping (works on air-gapped PPM hosts
  #     where the /html/, /news/ and /checkResults/ trees are not mirrored).
  #     Falls back to "source" when the package isn't installed yet, and to
  #     "skip" when neither an install nor an untarred source is available.
  #   "source"  — use pkg_ref(<sourced/pkg>, source = "pkg_source") when
  #     ref = "source". Same offline behaviour, but slower than "install".
  #   "remote"  — use pkg_ref(pkg, source = "pkg_bioc_remote"). Legacy
  #     behaviour: scrapes bioconductor.org. Only useful on hosts with
  #     outbound network access to bioconductor.org.
  #   "skip"    — no initial pass; the final pkg_source assessment runs
  #     with covr_coverage always included. Set this if the initial pass
  #     is not useful for your BioC subset and you're happy to pay the
  #     coverage cost on every BioC package.
  # CRAN / GitHub packages are unaffected by this knob.
  bioc_initial_ref: install
  opt_repos: 
    CRAN: https://packagemanager.posit.co/cran/2026-06-21
    BioC: https://bioconductor.org/packages/3.22/bioc #https://packagemanager.posit.co/bioconductor/latest 
    
remote_reduce:
  inherits: default
  downloads_1yr:
    cond:
      High: ~ is.na(.x) | .x < 80000
      Medium: ~ dplyr::between(.x, 80000, 240000)
      Low: ~ .x > 240000
    type: primary
    accept_cats: Low
    promote_min: ~ .x > 60000 # bare minimum needed for promo
    auto_accept: ~ .x > 1000000 # anything above this is gold & doesn't need all the rules
  reverse_dependencies:
    cond:
      # High: ~ is.na(.x)
      High: ~ .x < 2
      Medium: ~ dplyr::between(.x, 2, 10)
      Low: ~ .x > 10
    type: secondary
    accept_cats: [Low]
    auto_accept: ~ .x > 50 # anything above this is 'gold' & doesn't need to hit all the rules
  dependencies:
    cond:
      # High: ~ is.na(.x)
      High: ~ .x > 8
      Medium: ~ dplyr::between(.x, 4, 8)
      Low: ~ .x < 4
    type: secondary
    accept_cats: [Low, Medium]
  news_current:
    cond:
      # High: ~ is.na(.x)
      High: ~ .x != 1
      Low: ~ .x == 1
    type: secondary
    accept_cats: Low
  has_vignettes:
    cond:
      # High: ~ is.na(.x)
      High: ~ .x < 1
      Medium: ~ .x == 1
      Low: ~ .x > 1
    type: secondary
    accept_cats: Low
  has_source_control:
    cond:
      # High: ~ is.na(.x)
      High: ~ .x == 0
      Low: ~ .x > 0
    type: secondary
    accept_cats: Low
  has_website:
    cond:
      High: ~ .x == 0
      Low: ~ .x > 0
    type: secondary
    accept_cats: Low


decide:
  inherits: remote_reduce
  covr_coverage:
    cond:
      High: ~ is.na(.x) | .x < 35
      Medium: ~ dplyr::between(.x, 35, 65)
      Low: ~ .x > 65
    type: primary
    accept_cats: Low
  r_cmd_check_errors: # Pointless as a primary check since CRAN insures no warnings / errors
    cond:
      High: ~ .x > 1
      Low: ~ is.na(.x) | .x == 0
    type: secondary
    accept_cats: Low
  r_cmd_check_warnings: # Pointless as a primary check since CRAN insures no warnings / errors
    cond:
      High: ~ .x > 1
      Low: ~ is.na(.x) | .x == 0
    type: secondary
    accept_cats: Low
  dependencies:
    cond:
      # High: ~ is.na(.x)
      High: ~ .x > 35
      Medium: ~ dplyr::between(.x, 25, 35)
      Low: ~ .x < 25
    type: secondary
    accept_cats: [Low, Medium]
  has_examples:
    cond:
      High: ~ is.na(.x) | .x < 1
      Medium: ~ dplyr::between(.x, 1, 40)
      Low: ~ .x > 40
    type: secondary
    accept_cats: [Low, Medium]
  export_help:
    cond:
      High: ~ is.na(.x) | .x < 1
      Medium: ~ dplyr::between(.x, 1, 40)
      Low: ~ .x > 40
    type: secondary
    accept_cats: [Low, Medium]


