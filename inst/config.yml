  # Which riskmetric ref type to use for the *initial* assessment pass of
  # Bioconductor packages inside val_pkg(). Options:
  #   "install" — use pkg_ref(pkg, source = "pkg_install", lib.loc = .libPaths()[1]).
  #     Recommended default: reads DESCRIPTION/NEWS from the pipeline library
  #     with no bioconductor.org scraping (works on air-gapped PPM hosts
  #     where the /html/, /news/ and /checkResults/ trees are not mirrored).
  #     Falls back to "source" when the package isn't installed yet, and to
  #     "skip" when neither an install nor an untarred source is available.
  #   "source"  — use pkg_ref(<sourced/pkg>, source = "pkg_source") when
  #     ref = "source". Same offline behaviour, but slower than "install".
  #   "remote"  — use pkg_ref(pkg, source = "pkg_bioc_remote"). Legacy
  #     behaviour: scrapes bioconductor.org. Only useful on hosts with
  #     outbound network access to bioconductor.org.
  #   "skip"    — no initial pass; the final pkg_source assessment runs
  #     with covr_coverage always included. Set this if the initial pass
  #     is not useful for your BioC subset and you're happy to pay the
  #     coverage cost on every BioC package.
  # CRAN / GitHub packages are unaffected by this knob.
  #
  # Positioned above `decisions_lst` deliberately: pull_config() treats
  # every key that appears *after* `decisions_lst` as a rule entry, so
  # placing scalar defaults below it would push them into `rule_lst` and
  # blow up build_decisions_df() with `subscript out of bounds` when it
  # tries to read a non-existent `cond` element off a bare string.
  bioc_initial_ref: remote
  # Environment variables to set for the *final* `pkg_assess()` call in
  # `val_pkg()` — the call that may include `assess_covr_coverage`.
  # Wrapped via `withr::with_envvar()` so they are scoped to the
  # assessment and never leak into the parent R session.
  #
  # Why: `covr::package_coverage()` does not set `NOT_CRAN=true`
  # internally (verified against the installed covr namespace).
  # `testthat::skip_on_cran()` therefore fires during our covr runs and
  # silently drops a large slice of many packages' test suites, which
  # is one of the primary reasons `val.pipeline` reports 40–60% coverage
  # for packages whose GitHub badge reads > 90%. The three defaults
  # below are the conservative minimum needed to unlock those tests
  # without opting into flaky network / slow-integration suites:
  #
  #   * `NOT_CRAN=true` — unblocks `testthat::skip_on_cran()`, which is
  #     the biggest single lever.
  #   * `TESTTHAT=true` — matches what `testthat::test_check()` sets;
  #     some packages gate helper setup on this.
  #   * `_R_CHECK_FORCE_SUGGESTS_=false` — prevents R CMD check-style
  #     hard failures when a Suggests dep isn't installed; downstream
  #     tests may then use `skip_if_not_installed()` naturally.
  #
  # Two additional common opt-in knobs are scaffolded below so
  # reviewers can flip them on without having to remember exact
  # spellings — but ship *off* so behavior does not change silently:
  #
  #   * `NOT_ON_CRAN` — bespoke variant used by some packages that
  #     guard tests with `nzchar(Sys.getenv("NOT_ON_CRAN"))`. Empty
  #     string keeps those tests guarded off; flip to `"true"` to opt
  #     in.
  #   * `RUN_SLOW_TESTS` — common convention for expensive or
  #     integration-only suites checked as `== "true"`. `"false"`
  #     keeps them off; flip to `"true"` to opt in.
  #
  # Add further entries here without touching R code. Set the whole
  # block to `~` (YAML null) or an empty map to disable the wrapper
  # and inherit the parent session's env.
  covr_env_vars:
    NOT_CRAN: "true"
    TESTTHAT: "true"
    _R_CHECK_FORCE_SUGGESTS_: "false"
    NOT_ON_CRAN: ""
    RUN_SLOW_TESTS: "false"
  # ------------------------------------------------------------------
  # covr_skip_report:
  #   Controls when `val_pkg()` captures a per-package testthat skip
  #   report alongside `assess_covr_coverage`. The extra
  #   `testthat::test_dir()` call adds meaningful wall-clock per pkg,
  #   so most runs only want it on the pkgs where the skips are
  #   actually driving the risk decision — i.e. those below the covr
  #   `Low` cutoff.
  #
  #   capture: logical. Master on/off switch. `false` disables the
  #     feature entirely — no extra test_dir() runs, and the
  #     `covr_n_test` / `covr_n_skip` / `covr_pct_skip` /
  #     `covr_effective_coverage` columns are all NA. `true`
  #     (default) enables capture, subject to `threshold` below.
  #
  #   threshold: numeric on the same 0-100 scale as the
  #     `covr_coverage:` rule below. Capture runs only for pkgs
  #     whose raw covr_coverage came in below this cutoff. Defaults
  #     to 65 to match the current Medium/Low cutoff of the
  #     `covr_coverage:` rule. Set to 100 to capture for every
  #     non-auto-accept pkg (i.e. every pkg that actually executed
  #     `assess_covr_coverage`).
  #
  #   Both keys can be overridden per run via the
  #   `capture_covr_skip_report` / `covr_skip_report_threshold` args
  #   on `val_pipeline()`; the args set R options that
  #   `pull_covr_skip_report_config()` consults before falling back
  #   to this block.
  # ------------------------------------------------------------------
  covr_skip_report:
    capture: true
    threshold: 65
  # Repo sources for which Posit Package Manager does *not* support
  # curated (allow-list) package lists, and therefore must be shipped
  # as blocklists instead. For each source listed here,
  # `write_qualified_pkg_lists()` writes `blocklist-<source>.txt`
  # (containing every *assessed* package from that source whose
  # `final_decision` is NOT the qualified decision) rather than
  # `qualified-<source>.txt`. BioC is the current confirmed case
  # (PPM only supports blocklists for Bioconductor mirrors); add
  # `github` here too if/when the same restriction lands there. Set
  # to `~` (YAML null) or an empty list to fall back to allow-list
  # output for every source.
  blocklist_sources: [BioC]
  # Whitelist of `riskmetric` assessment names to run when the initial
  # BioC assessment uses `pkg_bioc_remote` (i.e. `bioc_initial_ref:
  # remote`). Most `pkg_bioc_remote` metrics scrape bioconductor.org
  # through `x$web_html` / `x$repo_base_url` — `has_news`,
  # `remote_checks`, `news_current`, `has_vignettes`, `has_maintainer`,
  # `bugs_status`, `has_source_control`, `has_bug_reports_url`,
  # `license`, ... — and on air-gapped PPM hosts those return
  # `<pkg_metric_error: Failed to connect to bioconductor.org port 443:
  # Connection refused>` even after
  # `configure_riskmetric_offline_if_requested()` has installed the
  # four riskmetric shims (the shims fix classification and the
  # `Repository` URL but PPM mirrors typically do not serve the
  # `/html/`, `/news/`, `/checkResults/` trees). Running them anyway
  # just fills the initial score frame with NAs and pushes packages
  # into unnecessary `covr_coverage` runs downstream.
  #
  # Metrics listed below are the ones whose result does *not* depend
  # on scraping the BioC mirror once the offline shims are installed:
  #   - `assess_reverse_dependencies` runs through
  #     `utils::available.packages()` after Shim 1.
  #   - `assess_dependencies` reads DESCRIPTION fields already cached
  #     by `memoise_bioc_available()` (Shim 2), no HTTP.
  # Set to `~` (YAML null) or delete the key to run every assessment
  # `riskmetric::all_assessments()` returns; that matches the pre-0.1.10
  # behaviour and is only appropriate on hosts with real outbound
  # access to bioconductor.org.
  # bioc_remote_initial_metrics:
  #   - assess_reverse_dependencies
  #   - assess_dependencies
  decisions_lst: [Low, Medium, High]
  opt_repos: 
    CRAN: https://packagemanager.posit.co/cran/2026-07-21
    BioC: https://bioconductor.org/packages/3.22/bioc #https://packagemanager.posit.co/bioconductor/latest 
    
remote_reduce:
  inherits: default
  downloads_1yr:
    cond:
      High: ~ is.na(.x) | .x < 80000
      Medium: ~ dplyr::between(.x, 80000, 200000)
      Low: ~ .x > 200000
    type: primary
    accept_cats: Low
    promote_min: ~ .x > 60000 # bare minimum needed for promo
    auto_accept: ~ .x > 1000000 # anything above this is gold & doesn't need all the rules
  reverse_dependencies:
    cond:
      # High: ~ is.na(.x)
      High: ~ .x < 2
      Medium: ~ dplyr::between(.x, 2, 10)
      Low: ~ .x > 10
    type: secondary
    accept_cats: [Low]
    auto_accept: ~ .x > 50 # anything above this is 'gold' & doesn't need to hit all the rules
  dependencies:
    cond:
      # High: ~ is.na(.x)
      High: ~ .x > 8
      Medium: ~ dplyr::between(.x, 4, 8)
      Low: ~ .x < 4
    type: secondary
    accept_cats: [Low, Medium]
  news_current:
    cond:
      # High: ~ is.na(.x)
      High: ~ .x != 1
      Low: ~ .x == 1
    type: secondary
    accept_cats: Low
  has_vignettes:
    cond:
      # High: ~ is.na(.x)
      High: ~ .x < 1
      Medium: ~ .x == 1
      Low: ~ .x > 1
    type: secondary
    accept_cats: Low
  has_source_control:
    cond:
      # High: ~ is.na(.x)
      High: ~ .x == 0
      Low: ~ .x > 0
    type: secondary
    accept_cats: Low
  has_website:
    cond:
      High: ~ .x == 0
      Low: ~ .x > 0
    type: secondary
    accept_cats: Low


decide:
  inherits: remote_reduce
  covr_coverage:
    cond:
      High: ~ is.na(.x) | .x < 35
      Medium: ~ dplyr::between(.x, 35, 65)
      Low: ~ .x > 65
    type: primary
    accept_cats: Low
  r_cmd_check_errors: # Pointless as a primary check since CRAN insures no warnings / errors
    cond:
      High: ~ .x > 1
      Low: ~ is.na(.x) | .x == 0
    type: secondary
    accept_cats: Low
  r_cmd_check_warnings: # Pointless as a primary check since CRAN insures no warnings / errors
    cond:
      High: ~ .x > 1
      Low: ~ is.na(.x) | .x == 0
    type: secondary
    accept_cats: Low
  dependencies:
    cond:
      # High: ~ is.na(.x)
      High: ~ .x > 35
      Medium: ~ dplyr::between(.x, 25, 35)
      Low: ~ .x < 25
    type: secondary
    accept_cats: [Low, Medium]
  has_examples:
    cond:
      High: ~ is.na(.x) | .x < 1
      Medium: ~ dplyr::between(.x, 1, 40)
      Low: ~ .x > 40
    type: secondary
    accept_cats: [Low, Medium]
  export_help:
    cond:
      High: ~ is.na(.x) | .x < 1
      Medium: ~ dplyr::between(.x, 1, 40)
      Low: ~ .x > 40
    type: secondary
    accept_cats: [Low, Medium]


